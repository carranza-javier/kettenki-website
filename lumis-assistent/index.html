<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>LUMIS KI-Assistent</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="login-screen">
        <div class="login-container">
            <div class="login-header">
                <img src="img/lumis_logo_1.webp" alt="LUMIS Logo" class="login-logo">
                <p class="login-subtitle">Dein intelligenter Kaffeebar-Assistent</p>
            </div>
            
            <form id="login-form" class="login-form">
                <div class="login-input-group">
                    <input 
                        type="text" 
                        id="login-username" 
                        class="login-input" 
                        placeholder="Benutzername"
                        autocomplete="username"
                        required
                    >
                </div>
                
                <div class="login-input-group">
                    <input 
                        type="password" 
                        id="login-password" 
                        class="login-input" 
                        placeholder="Passwort"
                        autocomplete="current-password"
                        required
                    >
                </div>
                
                <div id="login-error" class="login-error hidden"></div>
                
                <button type="submit" id="login-btn" class="login-btn">
                    <span class="login-btn-text">Anmelden</span>
                    <div class="login-spinner hidden"></div>
                </button>
            </form>
            
            <div class="login-footer">
                <p class="footer-text">
                    <span>Powered by</span>
                    <a href="https://kettenki.com" target="_blank" class="footer-link">KettenKI</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Language Switcher -->
    <div class="language-switcher">
        <button class="lang-btn active" data-lang="de">DE</button>
        <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <!-- Main Container -->
    <div class="app-container hidden">
        
        <!-- EMPTY STATE: Initial centered view -->
        <div id="empty-state" class="empty-state">
            <div class="empty-state-content">
                <header class="header">
                    <div class="logo-container">
                        <img src="img/lumis_logo_1.webp" alt="LUMIS Logo" class="logo">
                    </div>
                    <p class="subtitle" data-i18n="subtitle">Dein intelligenter Kaffeebar-Assistent</p>
                </header>
                
                <!-- Centered Input Box -->
                <div class="centered-input-container">
                    <div class="input-box">
                        <textarea 
                            id="initial-input" 
                            class="main-input" 
                            placeholder="Frage stellen..."
                            rows="1"
                            data-i18n-placeholder="placeholder"
                        ></textarea>
                        <button id="initial-send-btn" class="send-btn" aria-label="Send">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M2 10L18 10M18 10L11 3M18 10L11 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- Example Suggestions (minimal) -->
                <div class="suggestions">
                    <button class="suggestion-btn" data-question="Welche Aufgaben muss ich während der Frühschicht erledigen?">
                        <span class="suggestion-text" data-i18n="example1">Frühschicht Aufgaben</span>
                    </button>
                    <button class="suggestion-btn" data-question="Wie bereite ich einen Belle Giselle zu?">
                        <span class="suggestion-text" data-i18n="example2">Belle Giselle Rezept</span>
                    </button>
                    <button class="suggestion-btn" data-question="Was muss ich am Ende der Spätschicht machen?">
                        <span class="suggestion-text" data-i18n="example3">Schokoladenkuchen Zutaten</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- CHAT STATE: Conversation view -->
        <div id="chat-state" class="chat-state hidden">
            
            <!-- Compact Header -->
            <header class="compact-header">
                <img src="img/lumis_logo_1.webp" alt="LUMIS" class="compact-logo">
            </header>
            
            <!-- Messages Scroll Area -->
            <div id="messages-area" class="messages-area">
                <!-- Messages inserted here dynamically -->
            </div>
            
            <!-- Fixed Bottom Input -->
            <div class="bottom-input-container">
                <div class="input-box">
                    <textarea 
                        id="chat-input" 
                        class="main-input" 
                        placeholder="Frage stellen..."
                        rows="1"
                        data-i18n-placeholder="placeholder"
                    ></textarea>
                    <button id="chat-send-btn" class="send-btn" aria-label="Send">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M2 10L18 10M18 10L11 3M18 10L11 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
            
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">
            <span data-i18n="poweredBy">Powered by</span> 
            <a href="https://kettenki.com" target="_blank" class="footer-link">KettenKI</a>
        </p>
    </footer>

    <!-- JavaScript -->
    <script src="mock.js"></script>
    <script src="script.js"></script>
</body>
</html>
